version: '3.8'

services:
  app:
    build: .
    container_name: iperf_nexus_app
    restart: always
    ports:
      - "5000:5000"
      - "5201:5201/tcp"
      - "5201:5201/udp"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:alpine
    container_name: iperf_nexus_redis
    restart: always
    ports:
      - "6379:6379"
